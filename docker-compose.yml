version: "3.8"
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nlp_institute
    ports:
      - "5440:5432"
    volumes:
      - nlp_postgres_data:/var/lib/postgresql/data

volumes:
  nlp_postgres_data:
